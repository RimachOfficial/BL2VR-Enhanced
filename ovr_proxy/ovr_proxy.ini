; LibOVRRT64_1.dll proxy for Borderlands 2 VR (Oculus path)
; This file is re-read every 2 seconds while the game runs, so you can tune it live.

[ovr_proxy]
; 1 = proxy active (hooks + filter), 0 = bypass everything
enabled=1

; write a CSV-ish log of the raw pose data
log=1
; how many frames to log (then logging stops; filtering continues)
log_frames=600

; ---- filtering (the "not jittery" part) ----
; smooth the two hand poses
smooth_hands=0
; smooth the head pose (usually a bad idea - adds view lag). leave 0.
smooth_head=0

; One Euro filter: low cutoff = smoother but laggier, beta = how fast it
; opens up when you move quickly.  min_cutoff in Hz.
min_cutoff=3.0
beta=1.0
derivative_cutoff=1.0
; rotation gets its own responsiveness (rad/s are bigger numbers)
min_cutoff_rot=2.0
beta_rot=0.6

; extra motion prediction in milliseconds (0 = off). Cheap anti-lag, can overshoot.
predict_ms=0

; full path of the real runtime. empty = auto (Virtual Desktop's copy)
real_dll=