; BL2VR grip mod - pose smoothing
; Tune live: this file is re-read every 2 seconds while the game runs.

[bl2vr_grip]
; 0 = disable the smoothing entirely (hook stays installed, does nothing)
enabled=1

; write pose data to openvr_proxy.log (first log_frames frames only)
log=1
log_frames=300

; ---- smoothing ----
; hands: this is the "not jittery" part
smooth_hands=1
; head: usually bad (adds view lag). leave 0 unless you know you want it.
smooth_head=0

; One Euro filter.
;   lower min_cutoff  = smoother when still, but laggier
;   higher beta       = opens up faster when you move (less lag while moving)
min_cutoff=3.0
beta=1.0
derivative_cutoff=1.0
min_cutoff_rot=2.0
beta_rot=0.6

; extra motion prediction in ms (0 = off). Compensates for streaming latency
; but can overshoot when you stop quickly.
predict_ms=0