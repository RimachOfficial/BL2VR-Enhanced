; BL2VR grip mod - smoothing + zoom gate + two-handed grip
; Re-read every 2 seconds while the game runs - tune live.

[bl2vr_grip]
enabled=1
log=1
log_frames=150

; =======================================================================
;  THE BUBBLE - this is what makes it feel like a gaming mouse
; =======================================================================
; Below the threshold the hand is only TREMBLING -> smooth hard (rock steady).
; Above it the movement is DELIBERATE -> the filter opens up and follows the hand.
; The intent signal is the low-passed velocity VECTOR, so an oscillating tremor
; (4-12 Hz, its mean velocity is ~0) is ignored while real motion is not.

; --- release: what counts as DELIBERATE movement (opens the bubble) ---
release_rot=0.54
release_pos=0.13
release_span=1.5
intent_hz=6.0

; --- anti-float: a lag that PERSISTS also opens the bubble, so the gun always
; --- catches up instead of floating. Low-passed, so a tremor cancels out here.
err_tol_rot=2.5
err_tol_pos=1.5
err_hz=1.5

; --- cut_move: the LOWEST cutoff at full release. This is why fast movement is
; --- no longer jittery: even wide open the pose is still filtered (8 Hz = 20 ms)
; --- instead of being passed through raw. Lower = smoother at speed, more drag.
cut_move=8.0

; --- how fast the bubble opens/closes ---
attack_ms=200
release_ms=40

; =======================================================================
;  BLOCK 1 - used when ONLY the index trigger is held (one-handed / pistols)
;  NOTE: the 20x/60x only applies while the trigger is held >= trigger_threshold.
;  A quick tap (shooting) never qualifies - that is what the bubble is for.
; =======================================================================
trigger_gate=1
trigger_threshold=0.5
zoom_mult=20.0
zoom_mult_rot=60.0

; =======================================================================
;  BLOCK 2 - used ONLY while two-hand mode is active (replaces block 1)
; =======================================================================
twohand_min_cutoff=0.25
twohand_beta=0.10
twohand_min_cutoff_rot=0.05
twohand_beta_rot=0.02
; set twohand_min_cutoff_rot=0 to make two-hand fall back to block 1

; =======================================================================
;  BASE smoothing (no trigger, no two-hand)
; =======================================================================
smooth_hands=1
smooth_head=0
min_cutoff=5.0
beta=2.0
derivative_cutoff=1.0
min_cutoff_rot=3.0
beta_rot=1.2

; ========== TWO-HANDED GRIP setup ==========
twohand=1
twohand_gate=1
twohand_button=grip
twohand_hand=offhand
gun_hand=left
aim_axis=-z
twohand_min_dist=0.12
twohand_max_dist=0.75
twohand_blend=1.0

predict_ms=0
