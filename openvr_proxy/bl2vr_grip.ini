; BL2VR grip mod - smoothing + zoom gate + two-handed grip
; Re-read every 2 seconds while the game runs - tune live.
;
; Plain interpolator, always on. Every frame: gun += (hand - gun) * a
;   a = 1 / (1 + tau/dt),  tau = 1 / (2*pi*cutoff)
; The gun lags behind, accelerates towards your latest movement, and settles onto it.
; It can never pass your hand. There is no prediction and no speed threshold to flip.
;
; settle time:  0.05 Hz = 3.2 s (drifts)   0.4 Hz = 0.40 s   0.67 Hz = 0.24 s   1.5 Hz = 0.11 s

[bl2vr_grip]
enabled=1
log=1
log_frames=150

; =======================================================================
;  BASE smoothing - always on, no trigger and no two-hand
;  min_cutoff_rot=1.5 is 0.11 s: light, but it kills the worst yaw jitter
; =======================================================================
smooth_hands=1
smooth_head=0
min_cutoff=4.0
beta=2.0
derivative_cutoff=1.0
min_cutoff_rot=1.5
beta_rot=1.2

; =======================================================================
;  BLOCK 1 - stronger while the index trigger is held (one-handed / pistols)
;  zoom_mult divides the cutoff above:  4.0/6 = 0.67 Hz (0.24 s)
;                                       1.5/4 = 0.375 Hz (0.42 s) rotation
; =======================================================================
trigger_gate=1
trigger_threshold=0.5
zoom_mult=6.0
zoom_mult_rot=4.0

; =======================================================================
;  BLOCK 2 - used ONLY while two-hand mode is active (replaces block 1)
; =======================================================================
twohand_min_cutoff=0.8
twohand_beta=1.0
twohand_min_cutoff_rot=0.4
twohand_beta_rot=0.6
; set twohand_min_cutoff_rot=0 to make two-hand fall back to block 1

; ========== TWO-HANDED GRIP setup ==========
twohand=1
twohand_gate=1
twohand_button=grip
twohand_hand=offhand
gun_hand=left
aim_axis=-z
twohand_min_dist=0.12
twohand_max_dist=0.75
twohand_blend=1.0

; keep at 0 - extrapolation is the only thing here that could overshoot
predict_ms=0
