; BL2VR grip mod - smoothing + zoom gate + two-handed grip
; Re-read every 2 seconds while the game runs - tune live.
;
; CRITICALLY DAMPED FOLLOWER (zeta = 1) + LAG-PROPORTIONAL CATCH-UP.
;   base:     acc = w^2*err - 2*w*v
;   catch-up: st = st / (1 + beta*speed + catchup*lag)
; catch-up makes the spring stiffer the FURTHER BEHIND it is, so a big lag closes
; fast (no float) while a small lag (tremor) stays heavily smoothed. It is a
; continuous term - no threshold, so nothing can toggle while you track a target.
; catchup is applied ONLY to the heavy profiles (trigger held / two-hand), because
; on the light BASE profile it was measured to wreck tremor rejection (12.6% -> 29.8%).
;
; Values below are the ones measured by filter_bench (g++ -O2 -std=c++17 -I openvr_proxy filter_bench.cpp):
;   TRIGGER rot  0.30 Hz + catchup 120 : lag 1.62/3.25 deg, tail 0.08 s, t90 0.25 s, tremor 1.3%
;     (previous 0.375 Hz, no catchup   : lag 5.85/19.14 deg, tail 0.85 s, tremor 0.9% - unusable)
;   TWO-HAND rot 0.30 Hz + catchup 120 : lag 1.56/2.98 deg, tail 0.07 s, t90 0.23 s, tremor 1.3%
;   TRIGGER/TWO-HAND pos 0.5 Hz + catchup 150 : lag ~1.1/2.6 cm, tail 0.07 s
;   BASE         rot 1.5 Hz, catchup 0    : lag 1.15/2.59 deg, tail 0.06 s, tremor 12.6%
;
; cutoffs divide the BASE values:  zoom_mult = 4.0/0.5 = 8    zoom_mult_rot = 1.5/0.30 = 5
; catchup_* = 0 disables catch-up (exactly the old behaviour). predict_ms must stay 0.

[bl2vr_grip]
enabled=1
log=1
log_frames=150

; =======================================================================
;  BASE smoothing - always on, no trigger, no two-hand. catchup 0 by design.
; =======================================================================
smooth_hands=1
smooth_head=0
min_cutoff=4.0
beta=2.0
derivative_cutoff=1.0
min_cutoff_rot=1.5
beta_rot=1.2

; =======================================================================
;  BLOCK 1 - while the index trigger is held (one-handed / pistols / ADS)
;  4.0/8 = 0.5 Hz pos, 1.5/5 = 0.30 Hz rot, betas 0.25 / 0.24
; =======================================================================
trigger_gate=1
; 0.5 is HIGH. If the gate never flips in the log while you aim-hold, your aim
; press is lighter than this - lower it (0.2) rather than assuming the read is broken.
trigger_threshold=0.5
zoom_mult=8.0
zoom_mult_rot=5.0

; =======================================================================
;  BLOCK 2 - used ONLY while two-hand mode is active (replaces block 1)
; =======================================================================
twohand_min_cutoff=0.5
twohand_beta=1.5
twohand_min_cutoff_rot=0.30
twohand_beta_rot=1.5
; set twohand_min_cutoff_rot=0 to make two-hand fall back to block 1

; =======================================================================
;  CATCH-UP - stiffness per metre / per radian of lag. 0 = off (old behaviour).
; =======================================================================
catchup_pos=150
catchup_rot=120

; ========== TWO-HANDED GRIP setup ==========
twohand=1
twohand_gate=1
twohand_button=grip
twohand_hand=offhand
gun_hand=left
aim_axis=-z
twohand_min_dist=0.12
twohand_max_dist=0.75
twohand_blend=1.0

; keep at 0 - extrapolation is the only thing here that could overshoot
predict_ms=0
