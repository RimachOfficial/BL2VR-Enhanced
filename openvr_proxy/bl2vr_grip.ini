; BL2VR grip mod - two-handed grip + adaptive aim smoothing
; Re-read every 2 seconds while the game runs.
;
; ONE EURO filter, canonical form:
;   cutoff = min_cutoff + beta * |RAW controller velocity|
;   a = 1/(1 + tau/dt),   tau = 1/(2*pi*cutoff)
; The cutoff adapts to the RAW motion, so deliberate movement raises it IMMEDIATELY - the
; pose never has to accelerate out of a lag first (that was the "boat"). And there is no
; stored follower velocity, so there is no spring momentum to drift after you stop.
;
; derivative_cutoff smooths the speed estimate. Higher = reacts to movement onset sooner,
; which is why it is deliberately high (6 Hz).
;
; DO NOT use sub-1 Hz cutoffs. 0.3 Hz is a 0.53 s lag that keeps travelling for about a
; second after you stop - that is the float. Keep the cutoffs in the 1.5-4.5 Hz band and
; let beta do the work.

[bl2vr_grip]
enabled=1
log=1
log_frames=150

; Always-on baseline smoothing. Higher cutoff = more responsive, less filtering.
smooth_hands=1
smooth_head=0
min_cutoff=4.5
beta=2.0
derivative_cutoff=6.0
min_cutoff_rot=3.0
beta_rot=1.5

; Stronger filtering while the GUN-HAND index trigger is held.
; 4.5/2.0 = 2.25 Hz pos, 3.0/1.5 = 2.0 Hz rot.
; trigger_threshold is 0.25 because a soft aim-hold never reached the old 0.5 - the gate
; stayed closed and the profile never applied (the "no smoothing on trigger" report).
trigger_gate=1
trigger_threshold=0.25
zoom_mult=2.0
zoom_mult_rot=1.5

; Used ONLY while two-hand mode is active. Avoids the long follow-behind of sub-1 Hz.
twohand_min_cutoff=3.0
twohand_beta=2.2
twohand_min_cutoff_rot=2.0
twohand_beta_rot=1.5
; Set twohand_min_cutoff_rot=0 to fall back to the trigger/base profile.

; VIRTUAL GUNSTOCK: the hand-to-hand aim line has its OWN filter (the braced-stock feel).
; While the trigger is held, stock_cutoff is divided by stock_zoom_mult (1 Hz floor).
stock_cutoff=2.5
stock_beta=2.0
stock_zoom_mult=2.5

; CATCH-UP (optional): extra stiffness per metre / per radian of lag. 0 = off.
; It works by OPENING the filter to cut lag, so it always trades smoothing away - measured with
; tools/catchup_demo.cpp: at 60 deg/s, catchup_rot 150 raised the effective cutoff from 0.4 Hz
; to 5.2 Hz (tremor pass-through ~10% -> ~60%). It is skipped entirely while the trigger is
; held, because the trigger is meant to make the aim steadier, not rougher. Keep it small (0-30).
catchup_pos=0
catchup_rot=0

; PER-THREAD FILTER STATE. 1 (default, measured on the tested setup) = each calling thread keeps
; its own filters + clock. The game polls ovr_GetTrackingState from TWO threads whose absTime
; values are offset by about one frame and interleaved, so with a shared state (0) the pose it
; sees steps BACKWARDS on roughly half of all calls. The raw derivative then reports tens of
; metres/second of velocity the hand never had, the adaptive cutoff opens completely, and the
; result is "the smoothing seems off" - and profile changes stop mattering, because
; min_cutoff becomes irrelevant next to that fake velocity term.
; The log proves it: with 0 you see 't-backwards=...' in the jitter line on ~44% of samples;
; with 1 it should fall to ~0. Set 0 only to reproduce the old behaviour for comparison.
per_thread_filters=1

; ========== TWO-HANDED GRIP setup ==========
twohand=1
twohand_gate=1
twohand_button=grip
twohand_hand=offhand
gun_hand=left
aim_axis=-z
twohand_min_dist=0.12
twohand_max_dist=0.75
twohand_blend=1.0

; Do not predict ahead of the physical hand.
predict_ms=0
