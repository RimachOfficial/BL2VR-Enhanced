; BL2VR grip mod - smoothing + zoom gate + two-handed grip
; Re-read every 2 seconds while the game runs - tune live.

[bl2vr_grip]
enabled=1
log=1
log_frames=150

; =======================================================================
;  THE BUBBLE - this is what makes it feel like a gaming mouse
; =======================================================================
; Below the threshold the hand is only TREMBLING  -> smooth hard (rock steady).
; Above it the movement is DELIBERATE -> the raw pose passes straight through, 1:1.
; The intent signal is the low-passed velocity VECTOR, so an oscillating tremor
; (4-12 Hz, its mean velocity is ~0) is ignored while real motion is not.
;
; release_rot   how much yaw/pitch speed counts as deliberate intent (rad/s)
;               RAISE it if tremor still shows when you are trying to hold still
;               LOWER it if the gun trails behind while you track slowly
; release_pos   same, for the hands moving through space (m/s)
; release_span  fully released at release_* x span (1.5 = at 150% of the threshold)
; attack_ms     how fast it RE-LOCKS after you stop (soft landing on target)
; release_ms    how fast it UNLOCKS when you move (low = no delay when transitioning)
; intent_hz     low-pass applied to the velocity vector (tremor band is 4-12 Hz)
release_rot=0.54
release_pos=0.13
release_span=1.5
attack_ms=200
release_ms=40
intent_hz=6.0

; =======================================================================
;  BLOCK 1 - used when ONLY the index trigger is held  (one-handed / pistols)
;  NOTE: the 20x/60x only applies while the trigger is held at >= trigger_threshold.
;  A quick tap (shooting) never qualifies - that is what the bubble above is for.
; =======================================================================
trigger_gate=1
trigger_threshold=0.5
zoom_mult=20.0
zoom_mult_rot=60.0

; =======================================================================
;  BLOCK 2 - used ONLY while two-hand mode is active (replaces block 1 entirely)
; =======================================================================
twohand_min_cutoff=0.25
twohand_beta=0.10
twohand_min_cutoff_rot=0.05
twohand_beta_rot=0.02
; set twohand_min_cutoff_rot=0 to make two-hand fall back to block 1

; =======================================================================
;  BASE smoothing (no trigger, no two-hand)
; =======================================================================
smooth_hands=1
smooth_head=0
min_cutoff=5.0
beta=2.0
derivative_cutoff=1.0
min_cutoff_rot=3.0
beta_rot=1.2

; ========== TWO-HANDED GRIP setup ==========
twohand=1
twohand_gate=1
twohand_button=grip
twohand_hand=offhand
gun_hand=left
aim_axis=-z
twohand_min_dist=0.12
twohand_max_dist=0.75
twohand_blend=1.0

predict_ms=0

