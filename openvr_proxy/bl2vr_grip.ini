; BL2VR grip mod - smoothing + zoom gate + two-handed grip
; Re-read every 2 seconds while the game runs - tune live.
;
; CRITICALLY DAMPED FOLLOWER (Unity SmoothDamp / Game Programming Gems 4).
;   acc = w^2 * err - 2*w * v      w = 2 / smoothTime,  zeta = 1
; The gun keeps its own velocity: starts at ZERO, ramps up, peaks, decays into
; the target. That S-curve is what "smooth" means. zeta=1 = cannot overshoot.
;
; dt BUG FIXED: the old code stepped the follower with dt=0.0001 (a clamp floor),
; which made its clock run ~55x slower than real time - every profile collapsed
; into the same molasses and the trigger multipliers could not be felt at all.
; dt now comes from the measured average call rate.
;
; settle(95%) ~= 2.4 * smoothTime = 0.38 / cutoff:
;   3.0 Hz = 0.13 s (base)   1.0 Hz = 0.38 s (aim)   0.5 Hz = 0.76 s   0.25 Hz = 1.5 s (drift)
;
; beta stiffens the spring as the gun picks up speed - smooth, no threshold.
; predict_ms must stay 0: extrapolation is the only thing that could overshoot.

[bl2vr_grip]
enabled=1
log=1
log_frames=150

; =======================================================================
;  BASE smoothing - always on, no trigger and no two-hand (3.0 Hz = 0.13 s)
; =======================================================================
smooth_hands=1
smooth_head=0
min_cutoff=4.0
beta=2.0
derivative_cutoff=1.0
min_cutoff_rot=3.0
beta_rot=1.2

; =======================================================================
;  BLOCK 1 - stronger while the index trigger is held (one-handed / pistols)
;  3.0/3 = 1.0 Hz rot = 0.38 s settle: strong but trackable
; =======================================================================
trigger_gate=1
trigger_threshold=0.5
zoom_mult=3.0
zoom_mult_rot=3.0

; =======================================================================
;  BLOCK 2 - used ONLY while two-hand mode is active (replaces block 1)
;  1.0 Hz rot = 0.38 s settle
; =======================================================================
twohand_min_cutoff=1.0
twohand_beta=1.0
twohand_min_cutoff_rot=1.0
twohand_beta_rot=0.8
; set twohand_min_cutoff_rot=0 to make two-hand fall back to block 1

; ========== TWO-HANDED GRIP setup ==========
twohand=1
twohand_gate=1
twohand_button=grip
twohand_hand=offhand
gun_hand=left
aim_axis=-z
twohand_min_dist=0.12
twohand_max_dist=0.75
twohand_blend=1.0

predict_ms=0
